<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Line Manager</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/map.css">
<link rel="stylesheet" href="/tutorial.css">
<style>
  .wrap { max-width: 1180px; margin: 0 auto; padding: 14px 28px 24px; }
  header.top { display: flex; align-items: center; gap: 18px; margin-bottom: 6px; }
  header.top .brand { font-size: 22px; }
  header.top .spacer { flex: 1; }
  .stat { text-align: right; }
  .stat .label { font-size: 12px; color: var(--muted); font-weight: 500; text-transform: uppercase; letter-spacing: .08em; }
  .stat .value { font-size: 26px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .clock { min-width: 210px; }
  .clockbar { height: 8px; background: #ecdcc8; border-radius: 99px; overflow: hidden; margin-top: 6px; }
  .clockbar > div { height: 100%; background: var(--brown); border-radius: 99px; transition: width .3s linear; }

  /* centered screens */
  .center { min-height: 80vh; display: grid; place-items: center; text-align: center; }
  .center .card { padding: 40px 48px; max-width: 560px; width: 100%; }
  .center h1 { font-size: 54px; margin-bottom: 8px; }
  .center p { font-size: 18px; }
  .join-row { display: flex; gap: 12px; margin-top: 24px; }
  .err { color: var(--bad); font-weight: 600; min-height: 24px; margin-top: 10px; }

  /* decision */
  .round-title { display: flex; align-items: baseline; gap: 12px; margin: 8px 0 12px; }
  .round-title h2 { font-size: 24px; }
  .decision { display: grid; grid-template-columns: 1.35fr 1fr; gap: 22px; align-items: start; }
  .offer { padding: 18px 22px; position: relative; overflow: hidden; }
  .timer { position: absolute; left: 0; top: 0; height: 6px; background: var(--orange); transition: width .25s linear; }
  .timer.low { background: var(--bad); }
  .offer .kicker { font-size: 13px; font-weight: 600; color: var(--brown-3); text-transform: uppercase; letter-spacing: .1em; }
  .offer .kicker { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .kicker .secs { flex: none; font-size: 16px; font-weight: 800; line-height: 1; color: var(--brown); letter-spacing: 0; text-transform: none; font-variant-numeric: tabular-nums; }
  .kicker .secs.low { color: var(--bad); }
  .offer h3 { font-size: 25px; margin: 4px 0 4px; }
  .offer .blurb { color: var(--muted); margin: 0 0 10px; }
  .rows { display: grid; gap: 6px; }
  .row { display: flex; justify-content: space-between; align-items: center; padding: 8px 14px; border-radius: 12px; background: #faf3ea; font-size: 16px; }
  .row b { font-size: 19px; }
  .row > span { flex-shrink: 0; margin-right: 12px; }
  .row.sunk { background: #f3ece4; color: #6b5040; }
  .tag { margin-top: 10px; display: flex; align-items: center; gap: 14px; padding: 10px 16px; border-radius: 14px; font-weight: 600; font-size: 18px; border: 2px dashed; }
  .tag.ok { background: var(--good-bg); color: var(--good); border-color: var(--good); }
  .tag.no { background: var(--bad-bg); color: var(--bad); border-color: var(--bad); }
  .tag .ico { font-size: 26px; line-height: 1; }
  .tag .sub { font-size: 13px; font-weight: 500; opacity: .85; }
  .tagbar { position: relative; height: 12px; background: rgba(255,255,255,.7); border-radius: 99px; margin-top: 8px; overflow: visible; }
  .tagbar .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 99px; }
  .tagbar .mark { position: absolute; top: -5px; bottom: -5px; width: 3px; background: currentColor; border-radius: 2px; }
  .tagbar .marklabel { position: absolute; top: 0; font-size: 10px; line-height: 12px; font-weight: 700; white-space: nowrap; pointer-events: none; }
  .panel { padding: 22px 22px 24px; }
  .panel h4 { margin: 0 0 4px; font-size: 20px; }
  .panel p { margin: 0 0 16px; color: var(--muted); }
  .choices { display: grid; gap: 12px; }
  .choices button { width: 100%; text-align: left; display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; font-size: 18px; }
  .choices button small { font-weight: 500; opacity: .75; font-size: 13px; }
  .predict-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .predict-row button { font-size: 20px; padding: 18px; }
  .newmgr { margin-top: 10px; padding: 10px 14px; font-size: 15px; border-radius: 14px; background: #fff6e6; border: 2px solid #f6d9a8; display: flex; gap: 12px; }
  .newmgr .face { font-size: 30px; line-height: 1; }
  .newmgr b { display: block; margin-bottom: 2px; }
  .guess { font-size: 14px; font-weight: 600; margin-bottom: 12px; padding: 8px 12px; border-radius: 10px; }
  .guess.right { background: var(--good-bg); color: var(--good); }
  .guess.wrong { background: var(--bad-bg); color: var(--bad); }

  .simbanner { margin-top: 16px; padding: 22px 26px; display: flex; align-items: center; gap: 22px; }
  .simbanner .big { font-size: 34px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .simbanner .earned { color: var(--good); font-weight: 700; font-size: 22px; font-variant-numeric: tabular-nums; }
  .spinner { width: 34px; height: 34px; border-radius: 50%; border: 4px solid var(--peach); border-top-color: var(--orange); animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* mirror */
  .mirror { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; margin-top: 18px; }
  .mirror .card { padding: 22px; }
  .mirror h3 { font-size: 20px; margin-bottom: 12px; display: flex; justify-content: space-between; }
  .mi { display: flex; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); }
  .mi:first-of-type { border-top: 0; }
  .mi .mark { flex: 0 0 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; color: #fff; }
  .mi .mark.ok { background: var(--good); }
  .mi .mark.no { background: var(--bad); }
  .mi .t { font-weight: 600; }
  .mi .bias { display: inline-block; margin-top: 4px; font-size: 12px; font-weight: 700; color: var(--bad); background: var(--bad-bg); padding: 2px 8px; border-radius: 6px; }
  .mi p { margin: 2px 0 0; font-size: 14px; color: #5e4434; }
  .hero { display: grid; grid-template-columns: auto 1fr auto; gap: 28px; align-items: center; padding: 26px 30px; }
  .hero .rank { font-size: 64px; font-weight: 800; color: var(--orange); line-height: 1; }
  .hero .lost { font-size: 15px; }
  .lb { margin-top: 22px; padding: 18px 22px; }
  .lb ol { margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 6px 26px; }
  .lb li { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px dashed var(--line); }
  .lb li.me { font-weight: 800; color: var(--brown-2); }


  /* ================= factory game layout ================= */
  body.playing .wrap { max-width: none; padding: 10px 16px 12px; }
  body.playing header.top { margin-bottom: 8px; }
  .game { display: grid; grid-template-columns: 236px minmax(0, 1fr) 330px; gap: 14px; height: calc(100vh - 70px); min-height: 480px; }
  .side > * { flex-shrink: 0; }
  .side { display: flex; flex-direction: column; gap: 10px; min-height: 0; overflow-y: auto; scrollbar-width: thin; scrollbar-color: #e2cdb4 transparent; }
  .side .panel { background: #fff; border-radius: 16px; box-shadow: var(--shadow); padding: 14px 16px; }
  .eyebrow { font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--brown-3); margin-bottom: 4px; }
  .goal p { margin: 0; font-size: 14px; line-height: 1.45; font-weight: 500; }
  .clockrow { font-weight: 700; font-size: 15px; }
  .clockbar { height: 7px; background: #efe1cf; border-radius: 99px; overflow: hidden; margin: 6px 0 10px; }
  .clockbar > div { height: 100%; background: var(--brown); border-radius: 99px; }
  .cashrow { display: flex; justify-content: space-between; align-items: baseline; }
  .cashrow small { color: var(--muted); font-weight: 600; }
  .cashrow b { font-size: 28px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .spark { width: 100%; height: 64px; margin-top: 6px; overflow: visible; }
  .spark polyline { fill: none; stroke: var(--orange); stroke-width: 2.5; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
  .spark .tick { stroke: #efe1cf; stroke-dasharray: 3 3; vector-effect: non-scaling-stroke; }
  .replay { margin-top: 10px; }
  .replay input[type=range] { width: 100%; accent-color: var(--brown); }
  .rbtns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 6px; }
  button.sm { padding: 8px 10px; font-size: 13px; border-radius: 10px; }
  .log ol, .runs ul { list-style: none; margin: 0; padding: 0; }
  .log li { display: flex; gap: 10px; padding: 7px 0; border-top: 1px solid #f3e7d8; font-size: 13px; color: #b39a86; }
  .log li:first-child { border-top: 0; }
  .log li.did, .log li.cur { color: var(--brown); }
  .log li.cur .t { font-weight: 700; }
  .log .h { font-variant-numeric: tabular-nums; font-weight: 700; min-width: 40px; }
  .log .t small { display: block; color: var(--muted); font-weight: 500; }
  .log li.cur .t small { color: var(--orange); font-weight: 700; }
  .runs li { display: flex; justify-content: space-between; padding: 6px 10px; border-radius: 10px; font-size: 13px; font-weight: 600; }
  .runs li.on { background: var(--peach); }
  .runs li.todo { color: #b39a86; }

  .right .panel { padding: 16px 18px; position: relative; overflow: hidden; }
  .right .offer h3 { font-size: 22px; margin: 2px 0 2px; }
  .right .offer .blurb { font-size: 13.5px; margin: 0 0 10px; color: var(--muted); }
  .right .rows { gap: 5px; }
  .right .row { font-size: 14px; padding: 7px 12px; }
  .right .row b { font-size: 15px; text-align: right; }
  .right .tag { font-size: 15px; padding: 9px 12px; gap: 10px; margin-top: 8px; }
  .right .tag .ico { font-size: 22px; }
  .right .tag .sub { font-size: 11.5px; }
  .right .newmgr { font-size: 13px; margin-top: 8px; padding: 9px 12px; }
  .right .newmgr .face { font-size: 24px; }
  .right .actions h4 { margin: 0 0 4px; font-size: 18px; }
  .right .actions p { margin: 0 0 12px; color: var(--muted); font-size: 14px; }
  .right .actions .fine { margin: 10px 0 0; font-size: 12px; text-align: center; }
  .right .choices { gap: 10px; }
  .right .choices button { padding: 14px 16px; font-size: 16px; }
  .right .guess { font-size: 12px; line-height: 1.3; padding: 5px 10px; margin-bottom: 8px; }
  .right .kicker { font-size: 11.5px; font-weight: 600; color: var(--brown-3); text-transform: uppercase; letter-spacing: .1em; }
  .right .timer { height: 5px; }
  .running .simclock { font-size: 52px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.1; margin-top: 4px; }
  .running .earnbox { background: var(--good-bg); border-radius: 12px; padding: 10px 14px; margin: 10px 0; display: flex; justify-content: space-between; align-items: baseline; }
  .running .earnbox b { color: var(--good); font-size: 24px; font-variant-numeric: tabular-nums; }
  .running .what { font-size: 14px; margin: 0; }
  .done .final { font-size: 46px; font-weight: 800; line-height: 1.1; margin: 4px 0; }
  .done p { font-size: 14px; }

  /* playtest fixes */
  .right .actions { position: sticky; bottom: 0; z-index: 3; box-shadow: 0 -10px 24px rgba(74,31,12,.12), var(--shadow); }
  .right .kicker { display: flex; justify-content: space-between; gap: 8px; }
  .mi .mark.na { background: #c9b4a2; }
  .linkbtn { background: none; border: 0; padding: 0; font: inherit; color: inherit; text-decoration: underline; cursor: pointer; font-weight: 600; }
  .offgrp { display: flex; flex-wrap: wrap; gap: 8px 16px; justify-content: center; margin-top: 16px; font-size: 14px; color: var(--muted); }
  .offgrp span { flex-basis: 100%; }
  .center h1 { overflow-wrap: anywhere; }
  /* short laptop windows: fit the whole decision (tag, New Manager card, both buttons) without scrolling */
  @media (max-height: 800px) {
    .side.right { gap: 8px; }
    .right .panel { padding: 12px 14px; }
    .right .offer h3 { font-size: 19px; line-height: 1.2; }
    .right .rows { gap: 4px; }
    .right .row { padding: 5px 10px; }
    .right .tag, .right .newmgr { margin-top: 6px; }
    .right .tag { padding: 7px 10px; }
    .right .newmgr { padding: 7px 10px; gap: 10px; line-height: 1.35; }
    .right .newmgr .face { font-size: 20px; }
    .right .choices { gap: 8px; }
    .right .choices button { padding: 11px 14px; }
    .right .actions .fine { margin-top: 6px; }
  }
  @media (max-height: 700px) {
    .right .panel { padding: 12px 14px; }
    .right .offer h3 { font-size: 18px; }
    .right .row { padding: 5px 10px; font-size: 13px; }
    .right .row b { font-size: 14px; }
    .right .tag { padding: 6px 10px; font-size: 14px; }
    .right .tag .sub { display: none; }
    .right .newmgr { font-size: 12px; padding: 7px 10px; }
    .right .choices button { padding: 11px 14px; font-size: 15px; }
    .right .actions .fine { font-size: 11.5px; }
    .right .guess { padding: 5px 10px; margin-bottom: 8px; }
    .side .panel { padding: 10px 14px; }
    .cashrow b { font-size: 24px; }
    .spark { height: 44px; }
  }

  /* ================= v2: new nudges + fun ================= */
  .tut-mount { height: calc(100vh - 70px); min-height: 520px; }
  .fx-mute-slot { margin-left: 8px; display: inline-flex; }
  .spark .ghost { fill: none; stroke: #b9a08c; stroke-width: 2; stroke-dasharray: 4 4; vector-effect: non-scaling-stroke; opacity: .9; }
  .ghostleg { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 11.5px; color: var(--muted); margin-top: 4px; align-items: center; }
  .ghostleg i { display: inline-block; width: 14px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 4px; }
  .ghostleg i.you { background: var(--orange); }
  .ghostleg i.gh { background: repeating-linear-gradient(90deg, #b9a08c 0 4px, transparent 4px 7px); }
  .ghostleg b { color: var(--bad); margin-left: auto; }
  .ghostleg b.tie { color: var(--good); }
  .ghostbox { background: #f6efe6; border-radius: 12px; padding: 10px 12px; font-size: 13.5px; line-height: 1.45; margin: 10px 0; }
  .row b small.worth { display: block; font-size: 12px; font-weight: 700; margin-top: 1px; }
  small.worth.good { color: #8a5a1a; }
  small.worth.zero { color: #a5462c; }
  .strip { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
  .strip .guess, .strip .rulechip { margin: 0 !important; padding: 5px 9px; font-size: 12px; flex: 1 1 auto; border-radius: 9px; }
  .row.worth.zero { background: #f7ebe3; color: #8a4a33; }
  .row.worth b small { display: block; font-size: 11px; font-weight: 600; opacity: .85; }
  .rulechip { background: #fff3dc; border: 1.5px dashed #f2c477; border-radius: 10px; padding: 6px 10px; font-size: 12.5px; margin-bottom: 10px; }
  .rules { display: grid; gap: 8px; }
  .rulebtn { display: flex; gap: 10px; align-items: center; text-align: left; background: #fff; border: 2px solid var(--line); color: var(--brown); padding: 12px 14px; font-size: 14.5px; font-weight: 600; border-radius: 12px; }
  .rulebtn:hover { border-color: var(--orange); background: #fffaf2; transform: translateY(-1px); }
  .rulebtn .pin { font-size: 18px; }
  .badges { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .badge { background: linear-gradient(135deg, #fff3dc, #ffe2b3); border: 1px solid #f2c477; border-radius: 999px; padding: 4px 12px; font-size: 13px; font-weight: 700; animation: pop .4s cubic-bezier(.2,.8,.2,1) both; }
  .badge:nth-child(2) { animation-delay: .1s; } .badge:nth-child(3) { animation-delay: .2s; } .badge:nth-child(4) { animation-delay: .3s; } .badge:nth-child(5) { animation-delay: .4s; }
  .revealghost { text-align: left; margin-top: 16px; background: #faf3ea; border-radius: 14px; padding: 12px 14px; }
  .revealghost .spark { height: 70px; }
  .mirrorspark .spark { height: 52px; margin: 0 0 6px; }
  .rulerecap { margin-top: 18px; padding: 14px 20px; font-size: 15px; }
  @media (max-width: 1100px) { .game { grid-template-columns: 200px minmax(0,1fr) 300px; } }
  @media (max-height: 700px) { .side .goal { display: none; } }
  @media (max-height: 640px) { .right .actions .fine { display: none; } }
  @media (max-height: 620px) {
    .right .offer h3 { font-size: 16px; }
    .right .kicker { font-size: 10.5px; }
    .right .row { padding: 4px 10px; }
    .right .tag .ico { font-size: 18px; }
    .right .newmgr { font-size: 11.5px; }
    .right .choices button { padding: 9px 12px; font-size: 14px; }
    .right .guess { font-size: 11.5px; padding: 4px 8px; margin-bottom: 6px; }
  }

  @media (max-width: 860px) { .decision, .mirror { grid-template-columns: 1fr; } .line { grid-template-columns: repeat(2, 1fr); } .output { grid-column: 1 / -1; } .machine::after { display: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">Line Manager</div>
    <span id="teamPill" class="pill hidden"></span>
    <span id="conn" class="conn hidden" title="Connection"></span>
    <div class="spacer"></div>
  </header>
  <main id="main"></main>
</div>
<script src="/fx.js"></script>
<script src="/engine.js"></script>
<script src="/map.js"></script>
<script src="/tutorial.js"></script>
<script src="/team.js"></script>
</body>
</html>
