<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Line Manager · Host</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/style.css">
<style>
  body { font-size: 18px; }
  .wrap { max-width: 1500px; margin: 0 auto; padding: 26px 40px 110px; }
  header.top { display: flex; align-items: center; gap: 16px; margin-bottom: 22px; }
  header.top .brand { font-size: 28px; }
  header.top .spacer { flex: 1; }
  .phase-name { font-weight: 600; color: var(--brown-3); }

  .lobby { display: grid; grid-template-columns: 460px 1fr; gap: 36px; align-items: start; }
  .joinbox { padding: 30px; text-align: center; }
  .joinbox .url { font-size: 30px; font-weight: 800; word-break: break-all; margin: 6px 0 16px; }
  .joinbox img { width: 300px; height: 300px; }
  .lobby h1 { font-size: 76px; margin-bottom: 6px; }
  .lobby .tagline { font-size: 24px; color: var(--brown-2); margin: 0 0 26px; }
  .teams { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
  .chip { padding: 16px 18px; display: flex; align-items: center; gap: 12px; position: relative; }
  .chip .num { width: 38px; height: 38px; border-radius: 50%; background: var(--brown); color: #fff; display: grid; place-items: center; font-weight: 800; }
  .chip .nm { font-weight: 700; font-size: 17px; flex: 1; min-width: 0; overflow-wrap: anywhere; line-height: 1.2; }
  .chip .x { position: absolute; top: 4px; right: 8px; background: none; padding: 2px 6px; font-size: 16px; color: var(--muted); }
  .chip .pill { cursor: pointer; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--good); flex: 0 0 auto; }
  .dot.off { background: #d6c3b0; }
  .empty { color: var(--muted); font-size: 20px; padding: 26px; border: 2px dashed var(--line); border-radius: var(--radius); text-align: center; }

  .live { display: grid; grid-template-columns: 1.25fr 1fr; gap: 28px; align-items: start; }
  table { width: 100%; border-collapse: collapse; }
  .board { padding: 10px 22px 16px; }
  .board td, .board th { padding: 12px 8px; text-align: left; border-bottom: 1px solid var(--line); }
  .board th { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
  .board tr:last-child td { border-bottom: 0; }
  .board .cash { text-align: right; font-weight: 800; font-size: 22px; font-variant-numeric: tabular-nums; }
  .pips { display: flex; gap: 6px; }
  .pip { width: 22px; height: 22px; border-radius: 6px; background: #efe3d4; }
  .pip.bad { background: var(--bad); }
  .pip.good { background: var(--good); }
  .pip.done { background: var(--brown-3); }
  .pip.skip { background: #bda48e; }
  .pip.skipgood { background: repeating-linear-gradient(45deg, #bda48e 0 4px, #e9c8b7 4px 8px); }

  .chart { padding: 24px 26px; }
  .chart h3 { font-size: 22px; margin-bottom: 4px; }
  .chart .sub { color: var(--muted); font-size: 15px; margin-bottom: 18px; }
  .bars { display: flex; gap: 34px; align-items: flex-end; height: 300px; padding: 0 10px; border-bottom: 2px solid var(--line); }
  .bar { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; height: 100%; }
  .bar .val { font-size: 34px; font-weight: 800; margin-bottom: 8px; font-variant-numeric: tabular-nums; }
  .bar .col { width: 100%; max-width: 170px; border-radius: 14px 14px 4px 4px; transition: height .6s cubic-bezier(.2,.8,.2,1); min-height: 4px; }
  .barlabels { display: flex; gap: 34px; padding: 10px 10px 0; }
  .barlabels div { flex: 1; text-align: center; font-weight: 700; font-size: 18px; }
  .barlabels small { display: block; font-weight: 500; color: var(--muted); font-size: 14px; }

  .reveal h1 { font-size: 54px; margin-bottom: 6px; }
  .reveal .lead { font-size: 22px; color: var(--brown-2); margin: 0 0 24px; }
  .reveal-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); gap: 26px; }
  .verdict { margin-top: 24px; padding: 20px 26px; font-size: 22px; font-weight: 600; display: flex; gap: 16px; align-items: center; }
  .verdict .big { font-size: 40px; }

  .podium { display: flex; justify-content: center; align-items: flex-end; gap: 22px; margin: 30px 0 10px; }
  .pod { width: 260px; text-align: center; }
  .pod .block { border-radius: 18px 18px 6px 6px; display: grid; place-items: center; color: #fff; font-size: 54px; font-weight: 800; }
  .pod .nm { font-size: 24px; font-weight: 800; margin-bottom: 4px; }
  .pod .cash { font-size: 20px; color: var(--brown-2); margin-bottom: 10px; font-weight: 600; }
  .rest { max-width: 720px; margin: 22px auto 0; padding: 14px 24px; }
  .rest li { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px dashed var(--line); font-size: 20px; }
  .rest ol { list-style: none; margin: 0; padding: 0; }

  .controls { position: fixed; left: 0; right: 0; bottom: 0; padding: 14px 40px; background: rgba(253,246,236,.92); backdrop-filter: blur(8px); border-top: 1px solid var(--line); display: flex; gap: 12px; align-items: center; }
  .controls .spacer { flex: 1; }
  .controls button { font-size: 16px; padding: 12px 18px; }
  .steps { display: flex; gap: 6px; }
  .steps span { font-size: 13px; padding: 4px 10px; border-radius: 999px; background: #efe3d4; color: var(--muted); font-weight: 600; }
  .steps span.on { background: var(--brown); color: #fff; }

  @media (max-height: 820px) {
    body { font-size: 16px; }
    .wrap { padding: 14px 28px 96px; }
    header.top { margin-bottom: 10px; }
    .lobby h1 { font-size: 52px; }
    .lobby .tagline { font-size: 19px; margin-bottom: 16px; }
    .joinbox { padding: 20px; }
    .joinbox img { width: 230px; height: 230px; }
    .joinbox .url { font-size: 24px; }
    .chip { padding: 10px 14px; }
    .reveal h1 { font-size: 38px; }
    .reveal .lead { font-size: 17px; margin-bottom: 14px; }
    .chart { padding: 16px 20px; }
    .chart .sub { margin-bottom: 8px; }
    .bar .val { font-size: 26px; }
    .verdict { margin-top: 14px; padding: 12px 20px; font-size: 18px; }
    .verdict .big { font-size: 30px; }
    .podium { margin: 14px 0 6px; }
    .pod .block { font-size: 38px; }
    .rest { margin-top: 10px; padding: 8px 20px; }
    .rest li { padding: 4px 0; font-size: 17px; }
    .rest ol { columns: 2; column-gap: 30px; }
    .board td, .board th { padding: 8px; }
    .controls { padding: 10px 28px; }
  }
  .keybox { max-width: 420px; margin: 18vh auto; padding: 32px; text-align: center; }

  /* ---------- v2: header timer ---------- */
  .timer { display: inline-flex; align-items: baseline; gap: 8px; padding: 6px 14px; border-radius: 999px; background: #fff; border: 2px solid var(--line); font-size: 14px; font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; transition: background .3s, border-color .3s, color .3s; }
  .timer::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--good); align-self: center; }
  .timer b { font-size: 18px; color: var(--brown); font-weight: 800; }
  .timer .tg { font-size: 13px; font-weight: 500; padding-left: 8px; border-left: 1px solid var(--line); }
  .timer.over { border-color: var(--orange); background: #fff4e3; }
  .timer.over::before { background: var(--orange); }
  #muteSlot:empty { display: none; }

  /* ---------- v2: lobby ---------- */
  .readybar { display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 4px 22px; margin: 0 0 18px; }
  .readybar .rcount { font-size: 34px; font-weight: 600; color: var(--brown-2); line-height: 1.1; }
  .readybar .rcount b { font-size: 48px; font-weight: 800; color: var(--brown); font-variant-numeric: tabular-nums; }
  .readybar .rtrack { height: 14px; background: #efe3d4; border-radius: 99px; overflow: hidden; }
  .readybar .rtrack div { height: 100%; background: var(--orange); border-radius: 99px; transition: width .6s cubic-bezier(.2,.8,.2,1), background .4s; }
  .readybar.all .rtrack div { background: var(--good); }
  .readybar.all .rcount b { color: var(--good); }
  .readybar .rnote { grid-column: 1 / -1; font-size: 15px; color: var(--muted); font-weight: 500; }
  .readybar.all .rnote { color: var(--good); font-weight: 600; }
  .chip .mid { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: flex-start; gap: 4px; }
  .chip .nm { flex: none; max-width: 100%; overflow-wrap: break-word; }
  .chip .tags { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .teams.many { grid-template-columns: repeat(auto-fill, minmax(215px, 1fr)); gap: 8px; }
  .teams.many .chip { padding: 6px 26px 6px 10px; gap: 8px; }
  .chip .x { top: 2px; right: 4px; }
  .chip { padding-right: 30px; transition: box-shadow .4s; }
  .chip.is-ready { box-shadow: 0 0 0 2px rgba(47,138,76,.35), var(--shadow); }
  .status { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 600; padding: 2px 10px; border-radius: 999px; background: #f4ebe0; color: var(--muted); white-space: nowrap; }
  .status i { width: 7px; height: 7px; border-radius: 50%; background: var(--orange); animation: breathe 1.4s ease-in-out infinite; }
  .status.ok { background: var(--good); color: #fff; }
  .status.flip { animation: flip .5s cubic-bezier(.2,.8,.2,1); }
  .lobbynote { font-size: 15px; margin-top: 16px; }
  @keyframes breathe { 0%, 100% { opacity: .35; transform: scale(.8); } 50% { opacity: 1; transform: scale(1); } }
  @keyframes flip { 0% { transform: scale(.6); opacity: 0; } 60% { transform: scale(1.12); opacity: 1; } 100% { transform: scale(1); } }
  .btn-orange.glow { animation: btnglow 2.2s ease-in-out infinite; }
  @keyframes btnglow { 0%, 100% { box-shadow: 0 6px 16px rgba(243,154,30,.35), 0 0 0 0 rgba(243,154,30,.45); } 50% { box-shadow: 0 6px 22px rgba(243,154,30,.5), 0 0 0 10px rgba(243,154,30,0); } }

  /* ---------- v2: live rounds ---------- */
  .board .tname { font-weight: 700; font-size: 20px; }
  .boardnote { font-size: 14px; margin: 12px 0 0; }
  .board tr td { transition: background 1.2s; }
  .board tr.flash td { animation: rowflash 1.6s ease-out; }
  @keyframes rowflash { 0% { background: #ffe2b3; } 100% { background: transparent; } }
  .pips { align-items: center; }
  .pip.newpip { animation: pippop .6s cubic-bezier(.2,.8,.2,1); }
  @keyframes pippop { 0% { transform: scale(.3); background: var(--orange); } 60% { transform: scale(1.25); background: var(--orange); } 100% { transform: scale(1); } }
  .donetag { font-size: 12px; font-weight: 700; color: var(--brown-3); margin-left: 4px; text-transform: uppercase; letter-spacing: .06em; }
  .rset { font-size: 13px; font-weight: 600; padding: 3px 10px; border-radius: 999px; background: #f4ebe0; color: var(--muted); white-space: nowrap; }
  .rset.ok { background: var(--brown); color: #fff; }
  .livecard { text-align: center; display: flex; flex-direction: column; align-items: center; }
  .ring { position: relative; width: min(38vh, 380px); aspect-ratio: 1; margin: 18px auto 10px; }
  .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring circle { fill: none; stroke-width: 16; }
  .ring .track { stroke: #efe3d4; }
  .ring .prog { stroke: var(--orange); stroke-linecap: round; transition: stroke-dashoffset .9s cubic-bezier(.2,.8,.2,1), stroke .4s; }
  .ring.full .prog { stroke: var(--brown-3); }
  .ringlabel { position: absolute; inset: 0; display: grid; place-content: center; }
  .ringlabel .rn { font-size: min(11vh, 110px); font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
  .ringlabel .rn span { font-size: .4em; color: var(--muted); font-weight: 700; }
  .ringlabel .rl { font-size: 16px; color: var(--muted); font-weight: 600; margin-top: 4px; }
  .livestats { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; margin-top: 6px; }
  .livestats > div { display: flex; align-items: baseline; gap: 8px; padding: 8px 18px; border-radius: 14px; background: #f8efe4; }
  .livestats b { font-size: 28px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .livestats span { font-size: 15px; color: var(--muted); font-weight: 600; }
  .livestats .allset { background: #efe3d4; }

  /* ---------- v2: reveals ---------- */
  .bar .col { transition: height .9s cubic-bezier(.2,.8,.2,1); }
  .verdict .vtext { display: flex; flex-direction: column; gap: 6px; }
  .verdict .means { font-size: .78em; font-weight: 500; color: var(--brown-2); }
  .pop.late { animation-delay: .6s; }
  .pop.late2 { animation-delay: 1.3s; }
  .r2grid { grid-template-columns: 1fr 1fr 1.25fr; gap: 22px; }
  .r2grid .bars { gap: 22px; }
  .r2grid .barlabels { gap: 22px; }
  .hbars { display: flex; flex-direction: column; gap: 14px; margin-top: 4px; }
  .hrow { display: grid; grid-template-columns: minmax(0, 1.5fr) 1fr 30px; align-items: center; gap: 12px; }
  .hrow .hl { font-weight: 700; font-size: 16px; line-height: 1.2; }
  .hrow .hl small { display: block; font-weight: 500; font-size: 13px; color: var(--muted); margin-top: 2px; }
  .hrow .ht { height: 26px; background: #f4ebe0; border-radius: 8px; overflow: hidden; }
  .hrow .hf { height: 100%; background: var(--brown-3); border-radius: 8px; transition: width .9s cubic-bezier(.2,.8,.2,1); }
  .hrow.pb .hf { background: var(--orange); }
  .hrow .hn { font-size: 24px; font-weight: 800; text-align: right; font-variant-numeric: tabular-nums; }

  /* ---------- v2: final ---------- */
  .pod .block span { display: inline-block; }
  .podium.rise .pod .nm, .podium.rise .pod .cash { animation: pop .45s cubic-bezier(.2,.8,.2,1) both; animation-delay: calc(var(--d) + .55s); }
  .podium.rise .pod .block { transform-origin: bottom; animation: rise .75s cubic-bezier(.2,.9,.25,1.05) both; animation-delay: var(--d); }
  .podium.rise .pod .block span { animation: fadein .3s both; animation-delay: calc(var(--d) + .5s); }
  @keyframes rise { from { transform: scaleY(0); } to { transform: scaleY(1); } }
  .motto { font-size: 30px; font-weight: 800; margin-top: 30px; }

  @media (max-height: 820px) {
    .timer { padding: 4px 12px; }
    .timer b { font-size: 16px; }
    .readybar { margin-bottom: 12px; gap: 2px 18px; }
    .readybar .rcount { font-size: 24px; }
    .readybar .rcount b { font-size: 34px; }
    .readybar .rnote { font-size: 14px; }
    .chip { padding: 8px 30px 8px 12px; }
    .chip .num { width: 32px; height: 32px; }
    .chip .nm { font-size: 16px; }
    .status { font-size: 12px; padding: 1px 9px; }
    .chip .tags .pill { font-size: 12px; padding: 1px 9px; }
    .chip { padding-top: 6px; padding-bottom: 6px; }
    .chip .mid { gap: 2px; }
    .lobby .tagline { font-size: 17px; margin-bottom: 12px; }
    .lobby h1 { font-size: 46px; }
    .teams { gap: 10px; }
    .teams.many .chip .num { width: 26px; height: 26px; font-size: 14px; }
    .teams.many .chip .nm { font-size: 14px; }
    .teams.many + .lobbynote { display: none; }
    .lobbynote { font-size: 13px; margin-top: 10px; }
    .board .tname { font-size: 17px; }
    .boardnote { font-size: 13px; margin-top: 8px; }
    .ring { margin: 10px auto 6px; }
    .ringlabel .rl { font-size: 14px; }
    .livestats b { font-size: 22px; }
    .livestats > div { padding: 6px 14px; }
    .r2grid { gap: 16px; }
    .hbars { gap: 9px; }
    .hrow .hl { font-size: 14px; }
    .hrow .hl small { font-size: 12px; }
    .hrow .ht { height: 20px; }
    .hrow .hn { font-size: 20px; }
    .motto { font-size: 22px; margin-top: 14px; }
  }
  @media (min-height: 1000px) {
    .board td, .board th { padding: 16px 10px; }
    .board .tname { font-size: 22px; }
    .pip { width: 26px; height: 26px; }
    .teams { gap: 14px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .podium.rise .pod .block, .podium.rise .pod .nm, .podium.rise .pod .cash, .podium.rise .pod .block span, .board tr.flash td, .pip.newpip, .btn-orange.glow, .status i { animation: none !important; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">Line Manager</div>
    <span class="phase-name" id="phaseName"></span>
    <div class="spacer"></div>
    <span id="timer" class="timer hidden"></span>
    <span id="muteSlot"></span>
    <span id="conn" class="conn"></span>
  </header>
  <main id="main"></main>
</div>
<div class="controls hidden" id="controls"></div>
<script src="/engine.js"></script>
<script src="/fx.js"></script>
<script src="/host.js"></script>
</body>
</html>
